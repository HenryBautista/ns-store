# Server-side stack for the development/demo box. The SPA half lives in the ns-store-ui repo and
# joins the same external network, so either repo can redeploy without touching the other's files.
#
# The root docker-compose.yml stays as it is — that one is for local development.
name: nsstore-api

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nsstore}
      POSTGRES_USER: ${POSTGRES_USER:-nsstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nsstore} -d ${POSTGRES_DB:-nsstore}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nsstore-net

  api:
    build:
      context: ..
      dockerfile: src/NsStore.Api/Dockerfile
    image: ns-store-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Production keeps HSTS and the HTTPS redirect on; the forwarded headers below are what make
      # that redirect a no-op behind the proxy instead of an infinite bounce. Switch to Development
      # only if you want the Scalar UI at /scalar/v1.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ForwardedHeaders__Enabled: "true"

      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-nsstore};Username=${POSTGRES_USER:-nsstore};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env (32+ chars)}

      # Same-origin through nginx means CORS is never exercised; this is belt-and-braces.
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}

      # Only used while no user exists.
      Seed__Admin__Username: ${SEED_ADMIN_USERNAME:-}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD:-}

      # Demo dataset. Enabled is safe to leave on: the seeder no-ops once the catalog has rows.
      # Reset is the destructive one and is driven by the reset-demo-data workflow, never by a push.
      Seed__Demo__Enabled: ${SEED_DEMO_ENABLED:-true}
      Seed__Demo__Reset: ${SEED_DEMO_RESET:-false}

    # No ports: the API is reachable only from the web container on nsstore-net. That is also the
    # premise that makes ForwardedHeaders__Enabled safe.
    networks:
      - nsstore-net

volumes:
  db-data:

networks:
  nsstore-net:
    external: true
